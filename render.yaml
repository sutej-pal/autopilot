services:
  - type: web
    name: autopilot
    runtime: docker
    plan: 1c-2g
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/store.json
      - key: LOCAL_VAULT_KEY
        generateValue: true
      - key: AUTOPILOT_TOKEN
        generateValue: true
    disk:
      name: autopilot-data
      mountPath: /var/data
      sizeGB: 1
